<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangla TRX Natok</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent: #ff4757;
            --accent-hover: #e84118;
            --btn-blue: #1e90ff;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 30px;
        }

        /* হেডার */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 19px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        /* ক্যাটাগরি বাটন */
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ভিডিও কার্ড গ্রিড */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .video-card:active {
            transform: scale(0.97);
        }

        .video-card img {
            width: 100%;
            height: 135px;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 10px;
        }

        .video-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
            color: #ffffff;
        }

        .video-meta {
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
        }

        /* ডিটেইল পেজ */
        #detail-view {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .detail-banner {
            width: 100%;
            border-radius: 12px;
            max-height: 230px;
            object-fit: cover;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .detail-title {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .alert-box {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent);
            color: #ff6b81;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        /* টাস্ক বক্স */
        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .task-status {
            font-size: 11px;
            color: #ffa502;
            font-weight: 600;
        }

        .task-status.done {
            color: #2ed573;
        }

        .visit-btn {
            background: var(--btn-blue);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }

        .visit-btn:disabled {
            background: #2f3542;
            color: #747d8c;
            cursor: not-allowed;
        }

        /* ডাউনলোড বাটন */
        .download-btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 800;
            margin-top: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #2f3542;
            color: #747d8c;
            transition: all 0.3s;
        }

        .download-btn.unlocked {
            background: #2ed573;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .loader {
            text-align: center;
            padding: 50px 0;
            color: var(--accent);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- হোম ভিউ -->
    <div id="home-view">
        <div class="header">
            <h1><i class="fas fa-play-circle"></i> Bangla TRX Natok</h1>
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('All', this)">সবগুলো</button>
            <button class="tab-btn" onclick="filterCategory('BPS5', this)">BPS5</button>
            <button class="tab-btn" onclick="filterCategory('Web Series', this)">Web Series</button>
            <button class="tab-btn" onclick="filterCategory('Movie', this)">Movie</button>
        </div>

        <div id="loader" class="loader">
            <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>ভিডিও লোড হচ্ছে...
        </div>

        <div class="video-grid" id="video-grid"></div>
    </div>

    <!-- ডিটেইল ও টাস্ক ভিউ -->
    <div id="detail-view">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> ফিরে যান</button>
        <img id="detail-img" class="detail-banner" src="" alt="Banner">
        <h2 id="detail-title" class="detail-title"></h2>

        <div class="alert-box">
            ⚠️ <b>সতর্কবার্তা:</b> এডে ক্লিক করে অবশ্যই সাইটে পুরো ১০ সেকেন্ড থাকতে হবে। আগে ফিরে আসলে আনলক হবে না।
        </div>

        <!-- Task 1 -->
        <div class="task-card">
            <div>
                <div class="task-title">Task 1: এডে ক্লিক করে ১০ সেকেন্ড ভিজিট করুন</div>
                <div id="status-task-1" class="task-status">অসম্পূর্ণ</div>
            </div>
            <button id="btn-task-1" class="visit-btn" onclick="startTask(1)">VISIT</button>
        </div>

        <!-- Task 2 -->
        <div class="task-card">
            <div>
                <div class="task-title">Task 2: এডে ক্লিক করে ১০ সেকেন্ড ভিজিট করুন</div>
                <div id="status-task-2" class="task-status">অসম্পূর্ণ</div>
            </div>
            <button id="btn-task-2" class="visit-btn" onclick="startTask(2)">VISIT</button>
        </div>

        <!-- Download Button -->
        <button id="final-download-btn" class="download-btn" disabled onclick="requestDownload()">
            <i class="fas fa-lock"></i> টাস্ক পূরণ করে আনলক করুন
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // রেন্ডার ব্যাকএন্ড এপিআই
        const API_BASE = "https://bangla-trx-natok-bot.onrender.com"; 

        let appData = { videos: [], ads: {} };
        let currentVideo = null;
        let task1Done = false;
        let task2Done = false;

        async function initData() {
            try {
                // ক্যাশ এড়ানোর জন্য টাইমস্ট্যাম্প যোগ করা হয়েছে
                const res = await fetch(`${API_BASE}/api/data?t=${Date.now()}`);
                if (!res.ok) throw new Error("Network response was not ok");
                appData = await res.json();
                document.getElementById('loader').style.display = 'none';
                renderVideos(appData.videos || []);
            } catch (err) {
                // যদি রেন্ডার স্লিপ মোডে থাকে তবে ৫ সেকেন্ড পর আবার চেষ্টা করবে
                setTimeout(async () => {
                    try {
                        const retryRes = await fetch(`${API_BASE}/api/data?t=${Date.now()}`);
                        appData = await retryRes.json();
                        document.getElementById('loader').style.display = 'none';
                        renderVideos(appData.videos || []);
                    } catch (e) {
                        document.getElementById('loader').innerHTML = '<div style="color:#ff4757;">⚠️ সার্ভার চালু হতে ১০-১৫ সেকেন্ড সময় নিচ্ছে। অনুগ্রহ করে পেজটি আবার ওপেন করুন।</div>';
                    }
                }, 4000);
            }
        }

        function renderVideos(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            if (!videos || videos.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #8b949e; padding: 30px;">কোনো ভিডিও পাওয়া যায়নি</div>';
                return;
            }
            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openDetail(v);
                card.innerHTML = `
                    <img src="${v.thumb || 'https://placehold.co/400x250/161b22/ff4757?text=Natok'}" alt="${v.title}">
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-meta">
                            <span><i class="fas fa-folder" style="color:var(--accent);"></i> ${v.category || 'Natok'}</span>
                            <span>${v.date || ''}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'All') {
                renderVideos(appData.videos || []);
            } else {
                renderVideos((appData.videos || []).filter(v => v.category === cat));
            }
        }

        function openDetail(video) {
            currentVideo = video;
            task1Done = false;
            task2Done = false;

            document.getElementById('detail-img').src = video.thumb || 'https://placehold.co/600x300/161b22/ff4757?text=Natok';
            document.getElementById('detail-title').innerText = video.title;

            resetTaskUI(1);
            resetTaskUI(2);
            updateDownloadBtn();

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }

        function resetTaskUI(num) {
            const st = document.getElementById(`status-task-${num}`);
            const btn = document.getElementById(`btn-task-${num}`);
            st.className = 'task-status';
            st.innerText = 'অসম্পূর্ণ';
            btn.disabled = false;
            btn.innerText = 'VISIT';
        }

        function startTask(num) {
            const adUrl = num === 1 ? (appData.ads?.ad1 || 'https://google.com') : (appData.ads?.ad2 || 'https://google.com');
            const btn = document.getElementById(`btn-task-${num}`);
            const st = document.getElementById(`status-task-${num}`);

            if (tg && tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, '_blank');
            }

            let timeLeft = 10;
            btn.disabled = true;
            st.innerText = `অপেক্ষা করুন (${timeLeft}s)...`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    st.innerText = `অপেক্ষা করুন (${timeLeft}s)...`;
                } else {
                    clearInterval(timer);
                    st.className = 'task-status done';
                    st.innerHTML = '<i class="fas fa-check-circle"></i> সম্পন্ন!';
                    btn.innerText = 'DONE';
                    if (num === 1) task1Done = true;
                    if (num === 2) task2Done = true;
                    updateDownloadBtn();
                }
            }, 1000);
        }

        function updateDownloadBtn() {
            const btn = document.getElementById('final-download-btn');
            if (task1Done && task2Done) {
                btn.disabled = false;
                btn.className = 'download-btn unlocked';
                btn.innerHTML = '<i class="fas fa-download"></i> ডাউনলোড করুন (ইনবক্সে ভিডিও যাবে)';
            } else {
                btn.disabled = true;
                btn.className = 'download-btn';
                btn.innerHTML = '<i class="fas fa-lock"></i> টাস্ক পূরণ করে আনলক করুন';
            }
        }

        function requestDownload() {
            if (!currentVideo) return;
            const btn = document.getElementById('final-download-btn');
            btn.disabled = true;
            btn.innerHTML = '✅ আপনার ইনবক্স চেক করুন!';

            // টেলিগ্রাম বটের ইনবক্সে ডিপলিংক পাঠিয়ে ভিডিও ডেলিভারি করা
            const botUsername = "BanglaTRXNatok_bot";
            const deepLink = `https://t.me/${botUsername}?start=vid_${currentVideo.id}`;

            setTimeout(() => {
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(deepLink);
                    tg.close();
                } else {
                    window.location.href = deepLink;
                }
            }, 500);
        }

        initData();
    </script>
</body>
    </html>

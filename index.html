<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bachelor Point</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121316;
            --surface-color: #1a1c22;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-red: #e50914;
            --neon-pink: #c026d3;
            --text-color: #ffffff;
            --text-muted: #8e9bb0;
            --input-bg: #1c1e24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 14px;
        }

        /* সোশ্যাল বার বিজ্ঞাপন বক্স */
        .social-ad-container {
            width: 100%;
            margin-bottom: 12px;
            text-align: center;
            overflow: hidden;
            display: none;
        }

        /* স্ক্রিনশটের মতো হেডার */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-bar-icon {
            font-size: 22px;
            color: #ffffff;
            cursor: pointer;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-title .red-text {
            color: #e50914;
        }

        .brand-title .white-text {
            color: #ffffff;
        }

        .settings-circle {
            width: 38px;
            height: 38px;
            background: #2b1d3a;
            border: 2px solid #a855f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        /* স্ক্রিনশটের মতো ৩টি ক্যাটাগরি বাটন */
        .cat-btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .cat-btn {
            flex: 1;
            padding: 10px 0;
            background: #1c1e24;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }

        .cat-btn.active {
            background: #e50914;
            color: #ffffff;
            border-color: #e50914;
        }

        /* সার্চ বক্স */
        .search-box {
            position: relative;
            margin-bottom: 18px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
        }

        /* ভিডিও কার্ড ও পার্পল নিয়ন বর্ডার */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1.5px solid #a855f7;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
        }

        .thumb-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.4;
        }

        .video-date-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
        }

        .video-date-row i {
            color: #ef4444;
        }

        /* ডিটেইলস পেজ ভিউ */
        .detail-view {
            display: none;
            padding: 4px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .detail-card {
            background: var(--surface-color);
            border: 1.5px solid #a855f7;
            border-radius: 16px;
            padding: 14px;
        }

        #detailThumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            background: #000;
            margin-bottom: 12px;
        }

        .detail-title-card {
            border: 1.5px solid #ff007f;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            margin-bottom: 12px;
            background: rgba(255, 0, 127, 0.05);
        }

        /* ভিডিওর নিচে নেটিভ ব্যানার বক্স */
        .native-ad-container {
            width: 100%;
            margin-bottom: 14px;
            padding: 8px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            text-align: center;
            overflow: hidden;
            display: none;
        }

        .unlock-info-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #ef4444;
            background: rgba(239, 68, 68, 0.08);
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .task-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1.5px solid #ff007f;
            border-radius: 14px;
        }

        .task-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-icon {
            font-size: 18px;
            color: #94a3b8;
        }

        .task-icon.completed {
            color: #10b981;
        }

        .task-text h4 {
            font-size: 14px;
            font-weight: 600;
        }

        .task-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .visit-action-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .visit-action-btn.running {
            background: #0088cc;
            pointer-events: none;
        }

        .visit-action-btn.done {
            background: #10b981 !important;
            pointer-events: none;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: #10b981;
            color: #fff;
        }

        .download-btn.disabled {
            background: #1e293b;
            color: #64748b;
            pointer-events: none;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 13px;
        }

        .custom-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        .custom-popup-card {
            background: #18191f;
            width: 86%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-close-circle {
            width: 50px; height: 50px;
            background: #e61937;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 14px auto;
        }

        .popup-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .popup-desc {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .popup-highlight {
            color: #ef4444;
            font-weight: 700;
        }

        .popup-action-btn {
            background: #ffffff;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- সোশ্যাল বার কন্টেইনার -->
    <div id="socialAdBox" class="social-ad-container"></div>

    <div id="mainView">
        <!-- স্ক্রিনশটের মতো টপ হেডার -->
        <div class="top-nav">
            <div class="nav-left">
                <i class="fa-solid fa-bars menu-bar-icon"></i>
                <div class="brand-title">
                    <span class="red-text">Bachelor</span> <span class="white-text">Point</span>
                </div>
            </div>
            <div class="settings-circle">
                <i class="fa-solid fa-gear"></i>
            </div>
        </div>

        <!-- ৩টি ক্যাটাগরি বাটন -->
        <div class="cat-btn-row" id="categoryTabs"></div>

        <!-- সার্চ বক্স -->
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ভিডিও নাম বা এপিসোড লিখে সার্চ দিন" oninput="handleSearch()">
        </div>

        <div class="video-grid" id="videoContainer"></div>
        <div class="empty-msg" id="emptyMessage" style="display: none;">কোনো ভিডিও খুঁজে পাওয়া যায়নি!</div>
    </div>

    <!-- ডিটেইলস পেজ -->
    <div class="detail-view" id="detailView">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> ফিরে যান</button>
        <div class="detail-card">
            
            <img id="detailThumb" src="" alt="Thumbnail" onerror="handleImageFallback(this)">

            <div class="detail-title-card">
                <h2 id="detailTitle" style="font-size: 15px; font-weight: 700;"></h2>
            </div>

            <!-- ভিডিওর নিচে নেটিভ ব্যানার কন্টেইনার -->
            <div id="nativeAdBox" class="native-ad-container"></div>

            <div class="unlock-info-box">
                <i class="fa-solid fa-lock" style="color: #ef4444;"></i>
                <span>ভিডিওটি আনলক করার জন্য নিচের দুইটা এড দেখে নিন ১০ সেকেন্ড করে।</span>
            </div>

            <div class="task-list">
                <div class="task-card-row">
                    <div class="task-info-left">
                        <i id="task1Icon" class="fa-solid fa-circle-check task-icon"></i>
                        <div class="task-text">
                            <h4>Task 1</h4>
                            <p id="task1Desc">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                        </div>
                    </div>
                    <button id="task1Btn" class="visit-action-btn" onclick="startTask(1)">VISIT</button>
                </div>

                <div class="task-card-row">
                    <div class="task-info-left">
                        <i id="task2Icon" class="fa-solid fa-circle-check task-icon"></i>
                        <div class="task-text">
                            <h4>Task 2</h4>
                            <p id="task2Desc">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                        </div>
                    </div>
                    <button id="task2Btn" class="visit-action-btn" onclick="startTask(2)">VISIT</button>
                </div>
            </div>

            <button id="downloadBtn" class="download-btn disabled" onclick="sendToInbox()">
                <i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও
            </button>
        </div>
    </div>

    <div id="verifyFailPopup" class="custom-popup-overlay">
        <div class="custom-popup-card">
            <div class="popup-close-circle"><i class="fa-solid fa-xmark"></i></div>
            <div class="popup-title">ভেরিফিকেশন ব্যর্থ!</div>
            <div class="popup-desc">
                আপনি সম্পূর্ণ ১০ সেকেন্ড অ্যাড দেখেন নাই!<br>
                দেখেছেন <span id="seenSecondsTxt" class="popup-highlight">0</span> সেঃ। আরও <span id="needSecondsTxt" class="popup-highlight">10</span> সেঃ প্রয়োজন।
            </div>
            <button class="popup-action-btn" onclick="closePopup()">বুঝতে পেরেছি</button>
        </div>
    </div>

    <script>
        const BOT_USERNAME = "banglatrxnatok_bot";
        const SERVER_URL = "https://my-bot-server-bnj8.onrender.com";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], ads: {}, categories: [] };
        let activeCategory = '';
        let currentSelectedVideo = null;

        let task1Done = false;
        let task2Done = false;
        let activeTask = null;
        let taskStartTime = 0;
        let countdownTimer = null;

        function generateSvgPoster(title) {
            const cleanTitle = (title || 'Bachelor Point').replace(/[\'<>\"]/g, '').substring(0, 30);
            const svgContent = `
                <svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
                    <rect width="640" height="360" fill="#181920"/>
                    <circle cx="320" cy="150" r="42" fill="#e50914" fill-opacity="0.9"/>
                    <polygon points="312,135 336,150 312,165" fill="#ffffff"/>
                    <text x="320" y="240" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">${cleanTitle}</text>
                </svg>
            `.trim();
            return `data:image/svg+xml;utf8,${encodeURIComponent(svgContent)}`;
        }

        function handleImageFallback(img) {
            const title = img.getAttribute("data-title") || "Bachelor Point";
            const original = img.getAttribute("data-original");
            
            if (!img.dataset.retried && original && original.includes("/thumb/")) {
                img.dataset.retried = "true";
                img.src = `https://images.weserv.nl/?url=${encodeURIComponent(original)}&w=640&fit=cover&output=jpg&q=85`;
                return;
            }
            img.onerror = null;
            img.src = generateSvgPoster(title);
        }

        function resolveThumb(url, title) {
            if (!url || url.trim() === "" || url.includes("placehold.co")) {
                return generateSvgPoster(title);
            }
            let u = url.trim();
            if (u.includes("api.telegram.org")) {
                return `https://images.weserv.nl/?url=${encodeURIComponent(u)}&w=640&fit=cover&output=jpg&q=85`;
            }
            return u;
        }

        // বিজ্ঞাপন কোড সরাসরি এক্সিকিউট করার ডায়নামিক মেথড
        function injectAdScript(container, codeStr) {
            if (!codeStr || !codeStr.trim()) {
                container.style.display = "none";
                return;
            }
            container.style.display = "block";
            container.innerHTML = "";

            const raw = codeStr.trim();

            if (raw.startsWith("http://") || raw.startsWith("https://")) {
                const ifr = document.createElement("iframe");
                ifr.src = raw;
                ifr.style.width = "100%";
                ifr.style.border = "none";
                ifr.style.overflow = "hidden";
                ifr.scrolling = "no";
                container.appendChild(ifr);
                return;
            }

            const doc = new DOMParser().parseFromString(raw, "text/html");
            const nodes = Array.from(doc.body.childNodes);

            nodes.forEach(node => {
                if (node.tagName === "SCRIPT") {
                    const s = document.createElement("script");
                    if (node.src) s.src = node.src;
                    if (node.type) s.type = node.type;
                    s.async = true;
                    s.text = node.innerHTML;
                    container.appendChild(s);
                } else {
                    container.appendChild(node.cloneNode(true));
                }
            });
        }

        function runPopunder(popCode) {
            if (!popCode || !popCode.trim()) return;
            const raw = popCode.trim();
            if (raw.startsWith("http://") || raw.startsWith("https://")) {
                const s = document.createElement("script");
                s.src = raw;
                s.async = true;
                document.head.appendChild(s);
            } else {
                const doc = new DOMParser().parseFromString(raw, "text/html");
                const scripts = doc.querySelectorAll("script");
                scripts.forEach(sc => {
                    const s = document.createElement("script");
                    if (sc.src) s.src = sc.src;
                    s.async = true;
                    s.text = sc.innerHTML;
                    document.head.appendChild(s);
                });
            }
        }

        function renderAllAds() {
            const ads = appData.ads || {};
            injectAdScript(document.getElementById("socialAdBox"), ads.social_ad || "");
            injectAdScript(document.getElementById("nativeAdBox"), ads.native_ad || "");
            runPopunder(ads.popunder_ad || "");
        }

        async function initData() {
            try {
                const res = await fetch(`${SERVER_URL}/api/data?t=${Date.now()}`, {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                appData = await res.json();
                
                const cats = appData.categories || ["BPS5", "Web Series", "Movie"];
                if (cats.length > 0 && !activeCategory) {
                    activeCategory = cats[0];
                }
                
                renderCategoryTabs();
                renderVideos();
                renderAllAds();
            } catch (err) {
                console.error("ডাটা লোড ত্রুটি:", err);
            }
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById("categoryTabs");
            const cats = appData.categories || ["BPS5", "Web Series", "Movie"];
            
            let html = '';
            cats.forEach((c) => {
                const isActive = (activeCategory.trim().toUpperCase() === c.trim().toUpperCase());
                html += `<div class="cat-btn ${isActive ? 'active' : ''}" onclick="filterCategory('${c}')">${c}</div>`;
            });
            tabsContainer.innerHTML = html;
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCategoryTabs();
            renderVideos();
        }

        function renderVideos() {
            const container = document.getElementById("videoContainer");
            const empty = document.getElementById("emptyMessage");
            const query = document.getElementById("searchInput").value.toLowerCase().trim();

            let list = appData.videos || [];

            if (activeCategory) {
                list = list.filter(v => (v.category || '').trim().toUpperCase() === activeCategory.trim().toUpperCase());
            }

            if (query) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(query));
            }

            container.innerHTML = "";
            if (list.length === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
                list.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "video-card";
                    card.onclick = () => openDetail(item);
                    
                    const thumbUrl = resolveThumb(item.thumb, item.title);

                    card.innerHTML = `
                        <div class="thumb-wrapper">
                            <img class="thumb-img" src="${thumbUrl}" data-original="${item.thumb || ''}" data-title="${item.title || ''}" alt="Thumb" loading="lazy" onerror="handleImageFallback(this)">
                        </div>
                        <div class="card-details">
                            <div class="video-title">${item.title}</div>
                            <div class="video-date-row">
                                <i class="fa-regular fa-clock"></i>
                                <span>${item.date || 'Sep 17, 2026'}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function handleSearch() {
            renderVideos();
        }

        function openDetail(video) {
            currentSelectedVideo = video;
            document.getElementById("mainView").style.display = "none";
            document.getElementById("detailView").style.display = "block";

            const detailImg = document.getElementById("detailThumb");
            detailImg.setAttribute("data-original", video.thumb || "");
            detailImg.setAttribute("data-title", video.title || "");
            detailImg.removeAttribute("data-retried");
            detailImg.src = resolveThumb(video.thumb, video.title);
            document.getElementById("detailTitle").innerText = video.title;

            resetTasks();
        }

        function resetTasks() {
            task1Done = false;
            task2Done = false;
            activeTask = null;
            if (countdownTimer) clearInterval(countdownTimer);

            const btn1 = document.getElementById("task1Btn");
            const btn2 = document.getElementById("task2Btn");
            const dlBtn = document.getElementById("downloadBtn");

            btn1.className = "visit-action-btn";
            btn1.innerHTML = "VISIT";
            document.getElementById("task1Icon").className = "fa-solid fa-circle-check task-icon";
            document.getElementById("task1Desc").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            btn2.className = "visit-action-btn";
            btn2.innerHTML = "VISIT";
            document.getElementById("task2Icon").className = "fa-solid fa-circle-check task-icon";
            document.getElementById("task2Desc").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            dlBtn.className = "download-btn disabled";
        }

        function goBack() {
            if (countdownTimer) clearInterval(countdownTimer);
            activeTask = null;
            document.getElementById("detailView").style.display = "none";
            document.getElementById("mainView").style.display = "block";
        }

        function startTask(taskNum) {
            if (taskNum === 1 && task1Done) return;
            if (taskNum === 2 && task2Done) return;

            activeTask = taskNum;
            taskStartTime = Date.now();

            const adUrl = (taskNum === 1) ? (appData.ads?.ad1 || "https://google.com") : (appData.ads?.ad2 || "https://google.com");

            if (tg && tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, "_blank");
            }

            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const desc = document.getElementById(taskNum === 1 ? "task1Desc" : "task2Desc");

            btn.className = "visit-action-btn running";
            btn.innerHTML = `10s`;
            desc.innerText = "অপেক্ষা করুন...";

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                const passed = Math.floor((Date.now() - taskStartTime) / 1000);
                const remaining = 10 - passed;

                if (remaining > 0) {
                    btn.innerHTML = `${remaining}s`;
                } else {
                    clearInterval(countdownTimer);
                    completeTask(taskNum);
                }
            }, 500);
        }

        function completeTask(taskNum) {
            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const icon = document.getElementById(taskNum === 1 ? "task1Icon" : "task2Icon");
            const desc = document.getElementById(taskNum === 1 ? "task1Desc" : "task2Desc");

            btn.className = "visit-action-btn done";
            btn.innerHTML = `DONE`;
            icon.classList.add("completed");
            desc.innerText = "টাস্ক সম্পন্ন হয়েছে ✅";

            if (taskNum === 1) task1Done = true;
            if (taskNum === 2) task2Done = true;

            activeTask = null;

            if (task1Done && task2Done) {
                const dlBtn = document.getElementById("downloadBtn");
                dlBtn.className = "download-btn";
            }
        }

        function showFailedPopup(seenSec, needSec) {
            document.getElementById("seenSecondsTxt").innerText = seenSec;
            document.getElementById("needSecondsTxt").innerText = needSec;
            document.getElementById("verifyFailPopup").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("verifyFailPopup").style.display = "none";
        }

        function handleVisibilityOrFocus() {
            if (document.visibilityState === "visible" && activeTask !== null) {
                const elapsedSeconds = Math.floor((Date.now() - taskStartTime) / 1000);

                if (elapsedSeconds < 10) {
                    clearInterval(countdownTimer);
                    const taskFailed = activeTask;
                    activeTask = null;

                    const btn = document.getElementById(taskFailed === 1 ? "task1Btn" : "task2Btn");
                    const desc = document.getElementById(taskFailed === 1 ? "task1Desc" : "task2Desc");

                    btn.className = "visit-action-btn";
                    btn.innerHTML = `VISIT`;
                    desc.innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

                    const remainingNeed = 10 - (elapsedSeconds < 0 ? 0 : elapsedSeconds);
                    showFailedPopup(elapsedSeconds < 0 ? 0 : elapsedSeconds, remainingNeed);
                } else {
                    clearInterval(countdownTimer);
                    completeTask(activeTask);
                }
            }
        }

        document.addEventListener("visibilitychange", handleVisibilityOrFocus);
        window.addEventListener("focus", handleVisibilityOrFocus);

        function sendToInbox() {
            if (!task1Done || !task2Done) return;

            if (currentSelectedVideo) {
                const startParam = `vid_${currentSelectedVideo.id}`;
                const targetUrl = `https://t.me/${BOT_USERNAME}?start=${startParam}`;

                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(targetUrl);
                } else {
                    window.location.href = targetUrl;
                }

                if (tg && tg.close) {
                    setTimeout(() => tg.close(), 300);
                }
            }
        }

        initData();
    </script>
</body>

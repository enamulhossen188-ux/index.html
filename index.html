<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bachelor Point</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #121316;
            --surface-color: #1a1c22;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-red: #e50914;
            --neon-pink: #c026d3;
            --text-color: #ffffff;
            --text-muted: #8e9bb0;
            --input-bg: #1c1e24;
            --chip-bg: #1c1e24;
            --chip-color: #cbd5e1;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --card-border: rgba(0, 0, 0, 0.08);
            --primary-red: #e50914;
            --neon-pink: #7c3aed;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: #e2e8f0;
            --chip-bg: #e2e8f0;
            --chip-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 14px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-bar-icon {
            font-size: 22px;
            color: var(--text-color);
            cursor: pointer;
            padding: 4px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-title .red-text { color: #e50914; }
        .brand-title .white-text { color: var(--text-color); }

        .settings-circle {
            width: 38px;
            height: 38px;
            background: #2b1d3a;
            border: 2px solid #a855f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .settings-circle:active { transform: scale(0.92); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
        }

        .sidebar-menu {
            position: fixed;
            top: 0; left: -260px;
            width: 260px;
            height: 100%;
            background: var(--surface-color);
            border-right: 1px solid var(--card-border);
            z-index: 10000;
            transition: left 0.3s ease;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-menu.open { left: 0; }

        .sidebar-header {
            font-size: 18px;
            font-weight: 700;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            background: var(--input-bg);
            cursor: pointer;
        }

        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
            margin-bottom: 6px;
        }
        .category-scroll::-webkit-scrollbar { display: none; }

        .category-chip {
            padding: 8px 16px;
            background: var(--chip-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            color: var(--chip-color);
            cursor: pointer;
            text-transform: uppercase;
        }

        .category-chip.active {
            background: #e50914 !important;
            color: #ffffff !important;
            border-color: #e50914 !important;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        .search-box {
            position: relative;
            margin-bottom: 18px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .search-input::placeholder { color: var(--text-muted); }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1.5px solid #a855f7;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #181920;
        }

        .thumb-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
        }

        .video-date-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .video-date-row i { color: #ef4444; }

        .detail-view {
            display: none;
            padding: 4px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .detail-card {
            background: var(--surface-color);
            border: 1.5px solid #a855f7;
            border-radius: 16px;
            padding: 14px;
        }

        #detailThumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: 12px;
            background: #181920;
            margin-bottom: 12px;
        }

        .detail-title-card {
            border: 1.5px solid #ff007f;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            margin-bottom: 14px;
            background: rgba(255, 0, 127, 0.05);
        }

        .unlock-info-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #ef4444;
            background: rgba(239, 68, 68, 0.08);
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .task-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1.5px solid #ff007f;
            border-radius: 14px;
        }

        .task-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-icon {
            font-size: 18px;
            color: #94a3b8;
        }

        .task-icon.completed { color: #10b981; }

        .task-text h4 {
            font-size: 14px;
            font-weight: 600;
        }

        .task-text p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .visit-action-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            z-index: 100;
            position: relative;
        }

        .visit-action-btn.running {
            background: #0088cc;
            pointer-events: none;
        }

        .visit-action-btn.done {
            background: #10b981 !important;
            pointer-events: none;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: #10b981;
            color: #fff;
            margin-bottom: 16px;
        }

        .download-btn.disabled {
            background: #1e293b;
            color: #64748b;
            pointer-events: none;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 13px;
        }

        .custom-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }

        .custom-popup-card {
            background: #18191f;
            width: 86%;
            max-width: 320px;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .popup-close-circle {
            width: 50px; height: 50px;
            background: #e61937;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 14px auto;
        }

        .popup-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .popup-desc {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .popup-highlight {
            color: #ef4444;
            font-weight: 700;
        }

            background: #ffffff;

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bangla TRX Natok</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #080c14;
            --surface-color: rgba(18, 25, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #0088cc;
            --primary-gradient: linear-gradient(135deg, #0088cc 0%, #00b4d8 100%);
            --text-color: #f8fafc;
            --text-muted: #8e9bb0;
            --input-bg: rgba(14, 20, 31, 0.8);
            --badge-bg: rgba(0, 136, 204, 0.15);
            --badge-text: #38bdf8;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --surface-color: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: #e2e8f0;
            --badge-bg: #e0f2fe;
            --badge-text: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 14px;
            transition: background 0.3s ease;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .search-container {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 11px 16px 11px 40px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 136, 204, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 6px 14px;
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            color: var(--text-muted);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .category-chip.active {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 600;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 136, 204, 0.4);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .video-card:active {
            transform: scale(0.97);
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            background: #000;
        }

        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 9px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-color);
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .category-tag {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 2px 6px;
            border-radius: 5px;
            font-weight: 600;
        }

        .detail-view {
            display: none;
            padding: 4px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-card {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            backdrop-filter: blur(14px);
        }

        /* প্রফেশনাল ও চিকন টাস্ক বাটন ডিজাইন */
        .task-box {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-top: 14px;
            text-align: center;
        }

        .task-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .slim-task-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .slim-task-btn:active {
            transform: scale(0.97);
        }

        .slim-task-btn.running {
            border-color: #0088cc;
            background: rgba(0, 136, 204, 0.15);
            color: #38bdf8;
            pointer-events: none;
        }

        .slim-task-btn.done {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            pointer-events: none;
        }

        .slim-task-btn.failed {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            pointer-events: auto;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        }

        .download-btn.disabled {
            background: var(--card-border);
            color: var(--text-muted);
            pointer-events: none;
            box-shadow: none;
        }

        .task-status-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            min-height: 16px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-circle-play"></i> Bangla TRX Natok</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i> Dark</button>
    </div>

    <div id="mainView">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="নাটকের নাম বা পর্ব খুঁজুন..." oninput="handleSearch()">
        </div>

        <div class="category-scroll" id="categoryTabs">
            <div class="category-chip active" onclick="filterCategory('all', this)">সবগুলো</div>
            <div class="category-chip" onclick="filterCategory('BPS5', this)">BPS5</div>
            <div class="category-chip" onclick="filterCategory('Web Series', this)">Web Series</div>
            <div class="category-chip" onclick="filterCategory('Movie', this)">Movie</div>
        </div>

        <div class="video-grid" id="videoContainer"></div>
        <div class="empty-msg" id="emptyMessage" style="display: none;">কোনো ভিডিও খুঁজে পাওয়া যায়নি!</div>
    </div>

    <div class="detail-view" id="detailView">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> ফিরে যান</button>
        <div class="detail-card">
            <img id="detailThumb" src="" style="width: 100%; border-radius: 12px; margin-bottom: 12px;">
            <h2 id="detailTitle" style="font-size: 15px; margin-bottom: 5px;"></h2>
            <span id="detailCategory" class="category-tag"></span>

            <div class="task-box">
                <div id="taskNotice" class="task-status-text">নিচের ২টি টাস্কে ১০ সেকেন্ড করে ভিজিট করুন:</div>

                <!-- দুটি চিকন প্রফেশনাল টাস্ক বাটন -->
                <div class="task-grid">
                    <button id="task1Btn" class="slim-task-btn" onclick="startTask(1)">
                        <i class="fa-solid fa-play"></i> Task 1 (10s)
                    </button>
                    <button id="task2Btn" class="slim-task-btn" onclick="startTask(2)">
                        <i class="fa-solid fa-play"></i> Task 2 (10s)
                    </button>
                </div>

                <!-- ডাউনলোড বাটন -->
                <button id="downloadBtn" class="download-btn disabled" onclick="sendToInbox()">
                    <i class="fa-solid fa-download"></i> ইনবক্সে ভিডিও নিন
                </button>
            </div>
        </div>
    </div>

    <script>
        const BOT_USERNAME = "banglatrxnatok_bot";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], ads: {} };
        let activeCategory = 'all';
        let currentSelectedVideo = null;

        let task1Done = false;
        let task2Done = false;
        let activeTask = null;
        let taskStartTime = 0;
        let countdownTimer = null;

        async function initData() {
            try {
                const res = await fetch("https://my-bot-server-bnj8.onrender.com/api/data?t=" + Date.now());
                appData = await res.json();
                renderVideos();
            } catch (err) {
                console.error("ডাটা লোড ত্রুটি:", err);
            }
        }

        function renderVideos() {
            const container = document.getElementById("videoContainer");
            const empty = document.getElementById("emptyMessage");
            const query = document.getElementById("searchInput").value.toLowerCase().trim();

            let list = appData.videos || [];

            if (activeCategory !== 'all') {
                list = list.filter(v => (v.category || '').toLowerCase() === activeCategory.toLowerCase());
            }

            if (query) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(query));
            }

            container.innerHTML = "";
            if (list.length === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
                list.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "video-card";
                    card.onclick = () => openDetail(item);
                    card.innerHTML = `
                        <div class="thumb-wrapper">
                            <img class="thumb-img" src="${item.thumb || 'https://via.placeholder.com/300x300?text=Natok'}" alt="Thumb">
                        </div>
                        <div class="card-details">
                            <div class="video-title">${item.title}</div>
                            <div class="video-meta">
                                <span class="category-tag">${item.category || 'নাটক'}</span>
                                <span><i class="fa-regular fa-clock"></i> ${item.date || ''}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function handleSearch() {
            renderVideos();
        }

        function filterCategory(cat, el) {
            activeCategory = cat;
            document.querySelectorAll(".category-chip").forEach(c => c.classList.remove("active"));
            el.classList.add("active");
            renderVideos();
        }

        function openDetail(video) {
            currentSelectedVideo = video;
            document.getElementById("mainView").style.display = "none";
            document.getElementById("detailView").style.display = "block";

            document.getElementById("detailThumb").src = video.thumb || 'https://via.placeholder.com/300x300';
            document.getElementById("detailTitle").innerText = video.title;
            document.getElementById("detailCategory").innerText = video.category || 'নাটক';

            resetTasks();
        }

        function resetTasks() {
            task1Done = false;
            task2Done = false;
            activeTask = null;
            if (countdownTimer) clearInterval(countdownTimer);

            const btn1 = document.getElementById("task1Btn");
            const btn2 = document.getElementById("task2Btn");
            const dlBtn = document.getElementById("downloadBtn");
            const notice = document.getElementById("taskNotice");

            btn1.className = "slim-task-btn";
            btn1.innerHTML = `<i class="fa-solid fa-play"></i> Task 1 (10s)`;

            btn2.className = "slim-task-btn";
            btn2.innerHTML = `<i class="fa-solid fa-play"></i> Task 2 (10s)`;

            dlBtn.className = "download-btn disabled";
            dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ইনবক্সে ভিডিও নিন`;

            notice.style.color = "var(--text-muted)";
            notice.innerText = "নিচের ২টি টাস্কে ১০ সেকেন্ড করে ভিজিট করুন:";
        }

        function goBack() {
            if (countdownTimer) clearInterval(countdownTimer);
            activeTask = null;
            document.getElementById("detailView").style.display = "none";
            document.getElementById("mainView").style.display = "block";
        }

        function startTask(taskNum) {
            if (taskNum === 1 && task1Done) return;
            if (taskNum === 2 && task2Done) return;

            activeTask = taskNum;
            taskStartTime = Date.now();

            const adUrl = (taskNum === 1) ? (appData.ads?.ad1 || "https://google.com") : (appData.ads?.ad2 || "https://google.com");

            if (tg && tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, "_blank");
            }

            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const notice = document.getElementById("taskNotice");

            btn.className = "slim-task-btn running";
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 10s`;
            notice.style.color = "#38bdf8";
            notice.innerText = `Task ${taskNum}: অ্যাড পেজে ১০ সেকেন্ড অবস্থান করুন...`;

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                const passed = Math.floor((Date.now() - taskStartTime) / 1000);
                const remaining = 10 - passed;

                if (remaining > 0) {
                    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${remaining}s`;
                } else {
                    clearInterval(countdownTimer);
                    completeTask(taskNum);
                }
            }, 500);
        }

        function completeTask(taskNum) {
            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const notice = document.getElementById("taskNotice");

            btn.className = "slim-task-btn done";
            btn.innerHTML = `<i class="fa-solid fa-check"></i> Task ${taskNum}`;

            if (taskNum === 1) task1Done = true;
            if (taskNum === 2) task2Done = true;

            activeTask = null;

            if (task1Done && task2Done) {
                const dlBtn = document.getElementById("downloadBtn");
                dlBtn.className = "download-btn";
                notice.style.color = "#10b981";
                notice.innerText = "🎉 উভয় টাস্ক সম্পন্ন! নিচের বাটনে ক্লিক করুন।";
            } else {
                notice.style.color = "var(--text-muted)";
                notice.innerText = `Task ${taskNum} সম্পন্ন! বাকি টাস্কটি সম্পন্ন করুন।`;
            }
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible" && activeTask !== null) {
                const elapsedSeconds = (Date.now() - taskStartTime) / 1000;

                if (elapsedSeconds < 10) {
                    clearInterval(countdownTimer);
                    const taskFailed = activeTask;
                    activeTask = null;

                    const btn = document.getElementById(taskFailed === 1 ? "task1Btn" : "task2Btn");
                    const notice = document.getElementById("taskNotice");

                    btn.className = "slim-task-btn failed";
                    btn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Task ${taskFailed}`;

                    notice.style.color = "#ef4444";
                    notice.innerText = `⚠️ ১০ সেকেন্ডের আগে ফিরে এসেছেন! Task ${taskFailed} পুনরায় করুন।`;
                }
            }
        });

        function sendToInbox() {
            if (!task1Done || !task2Done) return;

            if (currentSelectedVideo) {
                const startParam = `vid_${currentSelectedVideo.id}`;
                const targetUrl = `https://t.me/${BOT_USERNAME}?start=${startParam}`;

                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(targetUrl);
                } else {
                    window.location.href = targetUrl;
                }

                if (tg && tg.close) {
                    setTimeout(() => tg.close(), 300);
                }
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
            const btn = document.getElementById("themeBtn");
            if (document.body.classList.contains("light-mode")) {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i> Light`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-moon"></i> Dark`;
            }
        }

        initData();
    </script>
</body>
</html>

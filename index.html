<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bachelor Point</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c0e;
            --surface-color: #14161b;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-red: #e50914;
            --neon-pink: #c026d3;
            --neon-blue: #00d2ff;
            --text-color: #ffffff;
            --text-muted: #8e9bb0;
            --input-bg: #1c1e24;
            --chip-bg: #1c1e24;
            --chip-color: #cbd5e1;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --card-border: rgba(0, 0, 0, 0.08);
            --primary-red: #e50914;
            --neon-pink: #7c3aed;
            --neon-blue: #0284c7;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: #e2e8f0;
            --chip-bg: #e2e8f0;
            --chip-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 12px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* টপ নেভিগেশন */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-bar-icon {
            font-size: 22px;
            color: var(--text-color);
            cursor: pointer;
            padding: 4px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-title .red-text { color: #e50914; }
        .brand-title .white-text { color: var(--text-color); }

        .settings-circle {
            width: 38px;
            height: 38px;
            background: #2b1d3a;
            border: 2px solid #a855f7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .settings-circle:active { transform: scale(0.92); }

        /* সাইডবার মেনু */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
        }

        .sidebar-menu {
            position: fixed;
            top: 0; left: -260px;
            width: 260px;
            height: 100%;
            background: var(--surface-color);
            border-right: 1px solid var(--card-border);
            z-index: 10000;
            transition: left 0.3s ease;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sidebar-menu.open { left: 0; }

        .sidebar-header {
            font-size: 18px;
            font-weight: 700;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            background: var(--input-bg);
            cursor: pointer;
        }

        /* সার্চ বক্স */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ক্যাটাগরি গ্রিড (স্ক্রল বা গ্রিড) */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
            margin-bottom: 10px;
        }
        .category-scroll::-webkit-scrollbar { display: none; }

        .category-chip {
            padding: 8px 16px;
            background: var(--chip-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            color: var(--chip-color);
            cursor: pointer;
            text-transform: uppercase;
        }

        .category-chip.active {
            background: #e50914 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        /* ফুল স্ক্রিনজুড়ে ১ কলামের বড় ভিডিও কার্ড */
        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1.5px solid var(--neon-blue);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.15);
        }

        .pin-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e50914;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 14px;
            z-index: 5;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 স্ট্যান্ডার্ড */
            background: #181920;
        }

        .thumb-wrapper.portrait {
            padding-top: 125%; /* 9:16 ভার্টিক্যাল */
        }

        .thumb-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
        }

        .video-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .meta-tag {
            color: #ef4444;
            font-weight: 700;
        }

        /* ডিটেইলস ও টাস্ক সেকশন */
        .detail-view {
            display: none;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-thumb-container {
            width: 100%;
            margin: 0 auto 14px auto;
            border: 2px solid #ff007f;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #181920;
            aspect-ratio: 16 / 9;
        }

        .detail-thumb-container.portrait {
            aspect-ratio: 9 / 12;
        }

        .detail-thumb-img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .play-icon-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 24px;
        }

        .detail-title-box {
            border: 1.5px solid #ff007f;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
            background: rgba(255, 0, 127, 0.05);
        }

        .task-notice-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #ef4444;
            background: rgba(239, 68, 68, 0.08);
            padding: 10px 12px;
            font-size: 12px;
            margin-bottom: 14px;
            border-radius: 0 8px 8px 0;
        }

        .task-notice-box.success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            color: #10b981;
        }

        .task-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1.5px solid #ff007f;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .visit-action-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .visit-action-btn.done {
            background: #10b981 !important;
            pointer-events: none;
        }

        /* অ্যাকশন বাটনসমূহ */
        .action-button-group {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .play-online-btn {
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #00d2ff 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            text-align: center;
        }

        .download-direct-btn {
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            text-align: center;
        }

        /* 🔥 স্ক্রিনশটের মতো টেলিগ্রামের ভেতরের আলাদা ভিডিও প্লেয়ার স্ক্রিন 🔥 */
        .video-player-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121316;
            z-index: 999999;
            flex-direction: column;
            padding: 16px;
            box-sizing: border-box;
        }

        .player-top-header {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #e50914;
            margin-bottom: 16px;
        }

        .player-notice-card {
            border: 1.5px solid #ff007f;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            background: rgba(255, 0, 127, 0.05);
            color: #ffffff;
        }

        .video-frame-wrapper {
            width: 100%;
            border: 1.5px solid var(--neon-blue);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        .video-frame-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .fullscreen-trigger-btn {
            background: #e50914;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            margin: 20px auto 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }
    </style>
</head>
<body>

    <!-- সাইডবার মেনু -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar-menu" id="sidebarMenu">
        <div class="sidebar-header">
            <span>মেনু অপশন</span>
            <i class="fa-solid fa-xmark" onclick="toggleSidebar()" style="cursor: pointer;"></i>
        </div>
        <div class="sidebar-item" onclick="toggleTheme()">
            <i class="fa-solid fa-circle-half-stroke"></i>
            <span id="themeMenuText">ডার্ক / লাইট মোড</span>
        </div>
        <div class="sidebar-item" onclick="showBotNotice()">
            <i class="fa-solid fa-bullhorn"></i>
            <span>বট নোটিশ</span>
        </div>
        <div class="sidebar-item" onclick="window.location.reload()">
            <i class="fa-solid fa-rotate-right"></i>
            <span>রিফ্রেশ করুন</span>
        </div>
    </div>

    <!-- হোম স্ক্রিন -->
    <div id="homeScreen">
        <div class="top-nav">
            <div class="nav-left">
                <i class="fa-solid fa-bars menu-bar-icon" onclick="toggleSidebar()"></i>
                <div class="brand-title">
                    <span class="red-text">Bachelor</span> <span class="white-text">Point</span>
                </div>
            </div>
            <div class="settings-circle" onclick="toggleTheme()" title="ডার্ক / লাইট মোড">
                <i class="fa-solid fa-gear" id="themeIcon"></i>
            </div>
        </div>

        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ভিডিও নাম লিখে সার্চ দিন" oninput="handleSearch()">
        </div>

        <div class="category-scroll" id="categoryTabs"></div>
        <div class="video-grid" id="videoContainer"></div>
    </div>

    <!-- ডিটেইলস ও টাস্ক স্ক্রিন -->
    <div class="detail-view" id="detailScreen">
        <button class="back-btn" onclick="backToHome()"><i class="fa-solid fa-arrow-left"></i> Back</button>
        
        <div class="detail-thumb-container" id="detailThumbWrapper">
            <img id="detailThumb" class="detail-thumb-img" src="" alt="Thumbnail" onerror="handleImageFallback(this)">
            <div class="play-icon-overlay"><i class="fa-solid fa-play"></i></div>
        </div>

        <div class="detail-title-box" id="detailTitle"></div>

        <div class="task-notice-box" id="taskNoticeBox">
            <i class="fa-solid fa-lock" id="taskNoticeIcon"></i>
            <span id="taskNoticeTxt">অনলাইনে প্লে বা ডাউনলোড করার জন্য নিচের এড দেখে নিন ১০ সেকেন্ড করে।</span>
        </div>

        <div class="task-list" id="taskListContainer">
            <div class="task-card-row">
                <div>
                    <h4 style="font-size: 13px;">Task 1</h4>
                    <p style="font-size: 10px; color: var(--text-muted);" id="t1Txt">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                </div>
                <button id="task1Btn" class="visit-action-btn" onclick="executeTask(1)">VISIT</button>
            </div>

            <div class="task-card-row">
                <div>
                    <h4 style="font-size: 13px;">Task 2</h4>
                    <p style="font-size: 10px; color: var(--text-muted);" id="t2Txt">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                </div>
                <button id="task2Btn" class="visit-action-btn" onclick="executeTask(2)">VISIT</button>
            </div>
        </div>

        <!-- অ্যাকশন বাটন গ্রুপ: অনলাইনে প্লে এবং ডাউনলোড -->
        <div class="action-button-group" id="actionButtonGroup">
            <button class="play-online-btn" onclick="launchVideoPlayer()">
                <i class="fa-solid fa-play"></i> অনলাইনে প্লে করুন
            </button>
            <button class="download-direct-btn" onclick="triggerDirectDownload()">
                <i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও
            </button>
        </div>
    </div>

    <!-- আলাদা সেকশনে ভিডিও প্লেয়ার স্ক্রিন (পপআন্ডার মুক্ত) -->
    <div class="video-player-screen" id="videoPlayerScreen">
        <div class="player-top-header">Hamster BD</div>

        <div class="player-notice-card">
            বটে ফিরে যেতে উপরে বাম পাশে <span style="color: #ef4444;">ক্রস (X)</span> আইকনে ক্লিক করুন
        </div>

        <div class="video-frame-wrapper" id="playerFrameWrapper">
            <video id="mainVideoPlayer" controls playsinline></video>
        </div>

        <button class="fullscreen-trigger-btn" onclick="toggleFullScreenPlayer()">
            <i class="fa-solid fa-expand"></i> ফুল স্ক্রিন করুন
        </button>
    </div>

    <script>
        const CURRENT_RENDER_URL = "https://index-html-6f0e.onrender.com";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], categories: [], ads: {} };
        let activeCategory = '';
        let currentVideo = null;
        let task1Done = false;
        let task2Done = false;
        let activeTaskNum = null;
        let taskStartStamp = 0;
        let popunderExecuted = false;
        let isPlayerActive = false;

        function toggleSidebar() {
            const sb = document.getElementById("sidebarMenu");
            const overlay = document.getElementById("sidebarOverlay");
            if (sb.classList.contains("open")) {
                sb.classList.remove("open");
                overlay.style.display = "none";
            } else {
                sb.classList.add("open");
                overlay.style.display = "block";
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
            const isLight = document.body.classList.contains("light-mode");
            const icon = document.getElementById("themeIcon");
            icon.className = isLight ? "fa-solid fa-moon" : "fa-solid fa-gear";
        }

        function showBotNotice() {
            toggleSidebar();
            alert(appData.update_notice || "বর্তমানে কোনো নতুন আপডেট নেই। আমাদের সাথেই থাকুন!");
        }

        // আকর্ষণীয় রঙিন ফলব্যাক ব্যানার তৈরি (সাদা পোস্টার সমস্যা সমাধান)
        function generateSvgPoster(title) {
            const cleanTitle = (title || 'Video Player').replace(/[\'<>\"]/g, '').substring(0, 28);
            const svgContent = `
                <svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
                    <defs>
                        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="640" height="360" fill="url(#grad)"/>
                    <circle cx="320" cy="150" r="45" fill="#e50914" fill-opacity="0.9"/>
                    <polygon points="312,132 338,150 312,168" fill="#ffffff"/>
                    <text x="320" y="240" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">${cleanTitle}</text>
                </svg>
            `.trim();
            return `data:image/svg+xml;utf8,${encodeURIComponent(svgContent)}`;
        }

        function handleImageFallback(img) {
            const title = img.getAttribute("data-title") || "Video";
            img.onerror = null;
            img.src = generateSvgPoster(title);
        }

        function resolveThumb(url, title) {
            if (!url || url.trim() === "" || url.includes("placehold.co")) {
                return generateSvgPoster(title);
            }
            return url.trim();
        }

        // গ্লোবাল নিরাপদ পপআন্ডার (প্লেয়ার স্ক্রিন ব্যতীত)
        function triggerSafePopunder() {
            if (popunderExecuted || isPlayerActive) return;
            const popUrl = (appData.ads?.popunder_ad || "").trim();
            if (popUrl.startsWith("http")) {
                popunderExecuted = true;
                if (tg && tg.openLink) tg.openLink(popUrl);
                else window.open(popUrl, "_blank");
            }
        }

        async function initData() {
            try {
                const res = await fetch(`${CURRENT_RENDER_URL}/api/data?t=${Date.now()}`);
                appData = await res.json();
                
                const cats = appData.categories || [];
                if (cats.length > 0 && !activeCategory) {
                    activeCategory = cats[0];
                }
                
                renderCategories();
                renderVideoCards();
            } catch (err) {
                console.error("ডাটা লোড ত্রুটি:", err);
            }
        }

        // 'All' বাদ দিয়ে শুধুমাত্র অ্যাডমিন ক্যাটাগরি রেন্ডার
        function renderCategories() {
            const container = document.getElementById("categoryTabs");
            const cats = appData.categories || [];
            let html = '';
            cats.forEach(c => {
                const isAct = (activeCategory.toLowerCase() === c.toLowerCase());
                html += `<div class="category-chip ${isAct ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</div>`;
            });
            container.innerHTML = html;
        }

        function selectCategory(cat) {
            triggerSafePopunder();
            activeCategory = cat;
            renderCategories();
            renderVideoCards();
        }

        function renderVideoCards() {
            const container = document.getElementById("videoContainer");
            const q = document.getElementById("searchInput").value.toLowerCase().trim();
            let list = appData.videos || [];

            if (activeCategory) {
                list = list.filter(v => (v.category || '').toLowerCase() === activeCategory.toLowerCase());
            }
            if (q) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(q));
            }

            container.innerHTML = "";
            list.forEach(v => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.onclick = () => openDetailsView(v);

                const isPortrait = (v.ratio === "9:16");
                const finalThumb = resolveThumb(v.thumb, v.title);

                card.innerHTML = `
                    <div class="pin-badge">📌 PIN</div>
                    <div class="thumb-wrapper ${isPortrait ? 'portrait' : ''}">
                        <img class="thumb-img" src="${finalThumb}" data-title="${v.title}" onerror="handleImageFallback(this)" alt="Thumb">
                    </div>
                    <div class="card-details">
                        <div class="video-title">${v.title}</div>
                        <div class="video-meta-row">
                            <span><i class="fa-regular fa-clock"></i> ${v.date || 'Today'}</span>
                            <span class="meta-tag">${v.category || ''}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSearch() {
            renderVideoCards();
        }

        function openDetailsView(video) {
            triggerSafePopunder();
            currentVideo = video;
            document.getElementById("homeScreen").style.display = "none";
            document.getElementById("detailScreen").style.display = "block";

            const thumbWrapper = document.getElementById("detailThumbWrapper");
            thumbWrapper.className = `detail-thumb-container ${(video.ratio === "9:16") ? 'portrait' : ''}`;
            
            const detailImg = document.getElementById("detailThumb");
            detailImg.setAttribute("data-title", video.title);
            detailImg.src = resolveThumb(video.thumb, video.title);

            document.getElementById("detailTitle").innerText = video.title;
            resetTaskStatus();
        }

        function resetTaskStatus() {
            task1Done = false;
            task2Done = false;
            activeTaskNum = null;

            document.getElementById("task1Btn").className = "visit-action-btn";
            document.getElementById("task1Btn").innerText = "VISIT";
            document.getElementById("t1Txt").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            document.getElementById("task2Btn").className = "visit-action-btn";
            document.getElementById("task2Btn").innerText = "VISIT";
            document.getElementById("t2Txt").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            document.getElementById("taskNoticeBox").className = "task-notice-box";
            document.getElementById("taskNoticeIcon").className = "fa-solid fa-lock";
            document.getElementById("taskNoticeTxt").innerText = "অনলাইনে প্লে বা ডাউনলোড করার জন্য নিচের এড দেখে নিন ১০ সেকেন্ড করে।";

            document.getElementById("taskListContainer").style.display = "block";
            document.getElementById("actionButtonGroup").style.display = "none";
        }

        function backToHome() {
            document.getElementById("detailScreen").style.display = "none";
            document.getElementById("homeScreen").style.display = "block";
        }

        // জিরো-ডিলে টাস্ক এক্সিকিউশন
        function executeTask(taskNum) {
            const directUrl = (taskNum === 1) ? (appData.ads?.ad1 || "").trim() : (appData.ads?.ad2 || "").trim();

            if (!directUrl.startsWith("http")) {
                alert("এডমিন এখনও কোনো বিজ্ঞাপন লিঙ্ক যুক্ত করেননি!");
                return;
            }

            activeTaskNum = taskNum;
            taskStartStamp = Date.now();

            if (tg && tg.openLink) tg.openLink(directUrl);
            else window.open(directUrl, "_blank");

            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");
            btn.innerText = "10s";
            txt.innerText = "অপেক্ষা করুন...";
        }

        function handleUserReturn() {
            if (document.visibilityState === "visible" && activeTaskNum !== null) {
                const elapsed = Math.floor((Date.now() - taskStartStamp) / 1000);
                const taskNum = activeTaskNum;
                activeTaskNum = null;

                if (elapsed >= 10) {
                    completeTaskSuccess(taskNum);
                } else {
                    const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
                    const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");
                    btn.innerText = "VISIT";
                    txt.innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";
                    alert(`দুঃখিত! আপনি ১০ সেকেন্ড অপেক্ষা করেন নাই। আরও ${10 - elapsed} সেকেন্ড দেখা প্রয়োজন ছিল।`);
                }
            }
        }

        document.addEventListener("visibilitychange", handleUserReturn);
        window.addEventListener("focus", handleUserReturn);

        function completeTaskSuccess(taskNum) {
            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");

            btn.className = "visit-action-btn done";
            btn.innerText = "COMPLETED";
            txt.innerText = "টাস্ক সম্পন্ন হয়েছে ✅";

            if (taskNum === 1) task1Done = true;
            if (taskNum === 2) task2Done = true;

            if (task1Done && task2Done) {
                document.getElementById("taskListContainer").style.display = "none";
                document.getElementById("taskNoticeBox").className = "task-notice-box success";
                document.getElementById("taskNoticeIcon").className = "fa-solid fa-circle-check";
                document.getElementById("taskNoticeTxt").innerText = "আপনি এড দেখা সম্পূর্ণ করেছেন। এখন সরাসরি প্লে বা ডাউনলোড করুন।";
                document.getElementById("actionButtonGroup").style.display = "flex";
            }
        }

        // 🔥 টেলিগ্রামের ভেতরে আলাদা সেকশনে ভিডিও চালু করা (কোনো পপআন্ডার থাকবে না) 🔥
        function launchVideoPlayer() {
            if (!currentVideo) return;
            isPlayerActive = true;

            document.getElementById("detailScreen").style.display = "none";
            const screen = document.getElementById("videoPlayerScreen");
            screen.style.display = "flex";

            const player = document.getElementById("mainVideoPlayer");
            const wrapper = document.getElementById("playerFrameWrapper");

            if (currentVideo.ratio === "9:16") {
                wrapper.style.aspectRatio = "9 / 14";
            } else {
                wrapper.style.aspectRatio = "16 / 9";
            }

            player.src = `${CURRENT_RENDER_URL}/stream/${currentVideo.file_id}`;
            player.play();
        }

        function toggleFullScreenPlayer() {
            const player = document.getElementById("mainVideoPlayer");
            if (player.requestFullscreen) {
                player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
                player.webkitRequestFullscreen();
            }
        }

        // ডাউনলোড ভিডিও বাটন চাপলে সরাসরি ভিডিও ফাইল ডাউনলোড
        function triggerDirectDownload() {
            if (!currentVideo) return;
            const streamUrl = `${CURRENT_RENDER_URL}/stream/${currentVideo.file_id}`;
            if (tg && tg.openLink) {
                tg.openLink(streamUrl);
            } else {
                window.open(streamUrl, "_blank");
            }
        }

        initData();
    </script>
</body>
            </html>

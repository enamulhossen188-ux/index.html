<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bachelor Point</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c0e;
            --surface-color: #14161b;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-red: #e50914;
            --neon-pink: #c026d3;
            --neon-blue: #00d2ff;
            --text-color: #ffffff;
            --text-muted: #8e9bb0;
            --input-bg: #1c1e24;
            --chip-bg: #1c1e24;
            --chip-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 12px;
        }

        /* সার্চ বক্স */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: #1a1c22;
            border: 1px solid var(--card-border);
            border-radius: 25px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ক্যাটাগরি গ্রিড (স্ক্রিনশটের মতো ২ কলাম) */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .category-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-btn.active {
            background: #e50914 !important;
            color: #ffffff !important;
        }

        /* ভিডিও কার্ড গ্রিড */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1.5px solid var(--neon-blue);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .pin-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #e50914;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            z-index: 5;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        /* 9:16 ভার্টিক্যাল থাম্বনেইল */
        .thumb-wrapper.portrait {
            padding-top: 140%;
        }

        /* 16:9 হরাইজন্টাল থাম্বনেইল */
        .thumb-wrapper.landscape {
            padding-top: 56.25%;
        }

        .thumb-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.3;
            height: 32px;
            overflow: hidden;
        }

        .video-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .meta-tag {
            color: #ef4444;
            font-weight: 700;
        }

        /* ডিটেইল ভিউ (টাস্ক স্ক্রিন) */
        .detail-view {
            display: none;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-thumb-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto 14px auto;
            border: 2px solid #ff007f;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .detail-thumb-container.portrait {
            aspect-ratio: 9 / 14;
        }

        .detail-thumb-container.landscape {
            aspect-ratio: 16 / 9;
        }

        .detail-thumb-img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .play-icon-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 24px;
        }

        .detail-title-box {
            border: 1.5px solid #ff007f;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            background: rgba(255, 0, 127, 0.05);
        }

        .task-notice-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #ef4444;
            background: rgba(239, 68, 68, 0.08);
            padding: 10px 12px;
            font-size: 12px;
            margin-bottom: 14px;
            border-radius: 0 8px 8px 0;
        }

        .task-notice-box.success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            color: #10b981;
        }

        .task-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #1c1e24;
            border: 1.5px solid #ff007f;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .visit-action-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .visit-action-btn.done {
            background: #10b981 !important;
            pointer-events: none;
        }

        .play-online-btn {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #0088cc 0%, #00d2ff 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            margin-top: 10px;
        }

        /* 🔥 স্ক্রিনশট অনুযায়ী ইন-অ্যাপ ভিডিও প্লেয়ার স্ক্রিন 🔥 */
        .video-player-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121316;
            z-index: 999999;
            flex-direction: column;
            padding: 14px;
            box-sizing: border-box;
        }

        .player-top-header {
            text-align: center;
            font-size: 20px;
            font-weight: 900;
            color: #e50914;
            margin-bottom: 16px;
        }

        .player-notice-card {
            border: 1.5px solid #ff007f;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 20px;
            background: rgba(255, 0, 127, 0.05);
        }

        .video-frame-wrapper {
            width: 100%;
            border: 1.5px solid var(--neon-blue);
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .video-frame-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
        }

        .fullscreen-trigger-btn {
            background: #e50914;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin: 16px auto 0 auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- ১. হোম স্ক্রিন -->
    <div id="homeScreen">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ভিডিও নাম লিখে সার্চ দিন" oninput="handleSearch()">
        </div>

        <div class="category-grid" id="categoryTabs"></div>
        <div class="video-grid" id="videoContainer"></div>
    </div>

    <!-- ২. ডিটেইলস ও টাস্ক স্ক্রিন -->
    <div class="detail-view" id="detailScreen">
        <button class="back-btn" onclick="backToHome()"><i class="fa-solid fa-arrow-left"></i> Back</button>
        
        <div class="detail-thumb-container" id="detailThumbWrapper">
            <img id="detailThumb" class="detail-thumb-img" src="" alt="Thumbnail">
            <div class="play-icon-overlay"><i class="fa-solid fa-play"></i></div>
        </div>

        <div class="detail-title-box" id="detailTitle"></div>

        <div class="task-notice-box" id="taskNoticeBox">
            <i class="fa-solid fa-lock" id="taskNoticeIcon"></i>
            <span id="taskNoticeTxt">অনলাইনে প্লে করার জন্য নিচের এড দেখে নিন ১০ সেকেন্ড করে।</span>
        </div>

        <div class="task-list" id="taskListContainer">
            <div class="task-card-row">
                <div>
                    <h4 style="font-size: 13px;">Task 1</h4>
                    <p style="font-size: 10px; color: var(--text-muted);" id="t1Txt">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                </div>
                <button id="task1Btn" class="visit-action-btn" onclick="executeTask(1)">VISIT</button>
            </div>

            <div class="task-card-row">
                <div>
                    <h4 style="font-size: 13px;">Task 2</h4>
                    <p style="font-size: 10px; color: var(--text-muted);" id="t2Txt">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                </div>
                <button id="task2Btn" class="visit-action-btn" onclick="executeTask(2)">VISIT</button>
            </div>
        </div>

        <button id="playOnlineBtn" class="play-online-btn" onclick="launchVideoPlayer()">
            <i class="fa-solid fa-play"></i> অনলাইনে প্লে করুন
        </button>
    </div>

    <!-- ৩. ভিডিও প্লেয়ার স্ক্রিন (পপআন্ডার মুক্ত) -->
    <div class="video-player-screen" id="videoPlayerScreen">
        <div class="player-top-header">Hamster BD</div>

        <div class="player-notice-card">
            বটে ফিরে যেতে উপরে বাম পাশে <span style="color: #ef4444;">ক্রস (X)</span> আইকনে ক্লিক করুন
        </div>

        <div class="video-frame-wrapper" id="playerFrameWrapper">
            <video id="mainVideoPlayer" controls playsinline></video>
        </div>

        <button class="fullscreen-trigger-btn" onclick="toggleFullScreenPlayer()">
            <i class="fa-solid fa-expand"></i> ফুল স্ক্রিন করুন
        </button>
    </div>

    <script>
        const CURRENT_RENDER_URL = "https://index-html-6f0e.onrender.com";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], categories: [], ads: {} };
        let activeCategory = 'All';
        let currentVideo = null;
        let task1Done = false;
        let task2Done = false;
        let activeTaskNum = null;
        let taskStartStamp = 0;
        let popunderExecuted = false;
        let isPlayerActive = false; // প্লেয়ারে থাকলে পপআন্ডার বন্ধ রাখার ফ্ল্যাগ

        // গ্লোবাল পপআন্ডার মেকানিজম (প্লেয়ার স্ক্রিন ছাড়া অন্য জায়গায় কার্যকর)
        function triggerSafePopunder() {
            if (popunderExecuted || isPlayerActive) return;
            const popUrl = (appData.ads?.popunder_ad || "").trim();
            if (popUrl.startsWith("http")) {
                popunderExecuted = true;
                if (tg && tg.openLink) tg.openLink(popUrl);
                else window.open(popUrl, "_blank");
            }
        }

        async function initData() {
            try {
                const res = await fetch(`${CURRENT_RENDER_URL}/api/data?t=${Date.now()}`);
                appData = await res.json();
                renderCategories();
                renderVideoCards();
            } catch (err) {
                console.error("ডাটা লোড ত্রুটি:", err);
            }
        }

        function renderCategories() {
            const container = document.getElementById("categoryTabs");
            const cats = ['All', ...(appData.categories || [])];
            let html = '';
            cats.forEach(c => {
                const isAct = (activeCategory.toLowerCase() === c.toLowerCase());
                html += `<button class="category-btn ${isAct ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>`;
            });
            container.innerHTML = html;
        }

        function selectCategory(cat) {
            triggerSafePopunder();
            activeCategory = cat;
            renderCategories();
            renderVideoCards();
        }

        function renderVideoCards() {
            const container = document.getElementById("videoContainer");
            const q = document.getElementById("searchInput").value.toLowerCase().trim();
            let list = appData.videos || [];

            if (activeCategory !== 'All') {
                list = list.filter(v => (v.category || '').toLowerCase() === activeCategory.toLowerCase());
            }
            if (q) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(q));
            }

            container.innerHTML = "";
            list.forEach(v => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.onclick = () => openDetailsView(v);

                const isPortrait = (v.ratio === "9:16");
                card.innerHTML = `
                    <div class="pin-badge">📌 PIN</div>
                    <div class="thumb-wrapper ${isPortrait ? 'portrait' : 'landscape'}">
                        <img class="thumb-img" src="${v.thumb}" onerror="this.src='https://placehold.co/600x400?text=Poster'">
                    </div>
                    <div class="card-details">
                        <div class="video-title">${v.title}</div>
                        <div class="video-meta-row">
                            <span><i class="fa-regular fa-clock"></i> ${v.date || 'Today'}</span>
                            <span class="meta-tag">${v.category || ''}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSearch() {
            renderVideoCards();
        }

        function openDetailsView(video) {
            triggerSafePopunder();
            currentVideo = video;
            document.getElementById("homeScreen").style.display = "none";
            document.getElementById("detailScreen").style.display = "block";

            const thumbWrapper = document.getElementById("detailThumbWrapper");
            thumbWrapper.className = `detail-thumb-container ${(video.ratio === "9:16") ? 'portrait' : 'landscape'}`;
            document.getElementById("detailThumb").src = video.thumb;
            document.getElementById("detailTitle").innerText = video.title;

            resetTaskStatus();
        }

        function resetTaskStatus() {
            task1Done = false;
            task2Done = false;
            activeTaskNum = null;

            document.getElementById("task1Btn").className = "visit-action-btn";
            document.getElementById("task1Btn").innerText = "VISIT";
            document.getElementById("t1Txt").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            document.getElementById("task2Btn").className = "visit-action-btn";
            document.getElementById("task2Btn").innerText = "VISIT";
            document.getElementById("t2Txt").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            document.getElementById("taskNoticeBox").className = "task-notice-box";
            document.getElementById("taskNoticeIcon").className = "fa-solid fa-lock";
            document.getElementById("taskNoticeTxt").innerText = "অনলাইনে প্লে করার জন্য নিচের এড দেখে নিন ১০ সেকেন্ড করে।";

            document.getElementById("taskListContainer").style.display = "block";
            document.getElementById("playOnlineBtn").style.display = "none";
        }

        function backToHome() {
            document.getElementById("detailScreen").style.display = "none";
            document.getElementById("homeScreen").style.display = "block";
        }

        // 🔥 টাস্ক এক্সিকিউশন: চাপার সাথে সাথে লিংকে নিয়ে যাবে 🔥
        function executeTask(taskNum) {
            const directUrl = (taskNum === 1) ? (appData.ads?.ad1 || "").trim() : (appData.ads?.ad2 || "").trim();

            if (!directUrl.startsWith("http")) {
                alert("এডমিন এখনও কোনো বিজ্ঞাপন লিঙ্ক যুক্ত করেননি!");
                return;
            }

            activeTaskNum = taskNum;
            taskStartStamp = Date.now();

            // কোনো অপেক্ষা ছাড়াই তাৎক্ষণিক লিংক ওপেন
            if (tg && tg.openLink) tg.openLink(directUrl);
            else window.open(directUrl, "_blank");

            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");
            btn.innerText = "10s";
            txt.innerText = "অপেক্ষা করুন...";
        }

        // ব্যবহারকারী মিনি অ্যাপে ফিরে আসলে ১০ সেকেন্ড যাচাই
        function handleUserReturn() {
            if (document.visibilityState === "visible" && activeTaskNum !== null) {
                const elapsed = Math.floor((Date.now() - taskStartStamp) / 1000);
                const taskNum = activeTaskNum;
                activeTaskNum = null;

                if (elapsed >= 10) {
                    completeTaskSuccess(taskNum);
                } else {
                    const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
                    const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");
                    btn.innerText = "VISIT";
                    txt.innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";
                    alert(`দুঃখিত! আপনি ১০ সেকেন্ডের পূর্বে চলে এসেছেন। আরও ${10 - elapsed} সেকেন্ড অপেক্ষা প্রয়োজন ছিল।`);
                }
            }
        }

        document.addEventListener("visibilitychange", handleUserReturn);
        window.addEventListener("focus", handleUserReturn);

        function completeTaskSuccess(taskNum) {
            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");

            btn.className = "visit-action-btn done";
            btn.innerText = "COMPLETED";
            txt.innerText = "টাস্ক সম্পন্ন হয়েছে ✅";

            if (taskNum === 1) task1Done = true;
            if (taskNum === 2) task2Done = true;

            if (task1Done && task2Done) {
                document.getElementById("taskListContainer").style.display = "none";
                document.getElementById("taskNoticeBox").className = "task-notice-box success";
                document.getElementById("taskNoticeIcon").className = "fa-solid fa-circle-check";
                document.getElementById("taskNoticeTxt").innerText = "আপনি এড দেখা সম্পূর্ণ করেছেন। এখন সরাসরি প্লে করুন।";
                document.getElementById("playOnlineBtn").style.display = "block";
            }
        }

        // 🔥 স্ক্রিনশটের মতো ফুলস্ক্রিন ইন-অ্যাপ ভিডিও প্লেয়ার চালু করা 🔥
        function launchVideoPlayer() {
            if (!currentVideo) return;
            isPlayerActive = true; // প্লেয়ার চালু থাকলে পপআন্ডার বন্ধ থাকবে

            document.getElementById("detailScreen").style.display = "none";
            const screen = document.getElementById("videoPlayerScreen");
            screen.style.display = "flex";

            const player = document.getElementById("mainVideoPlayer");
            const wrapper = document.getElementById("playerFrameWrapper");

            if (currentVideo.ratio === "9:16") {
                wrapper.style.aspectRatio = "9 / 14";
            } else {
                wrapper.style.aspectRatio = "16 / 9";
            }

            player.src = `${CURRENT_RENDER_URL}/stream/${currentVideo.file_id}`;
            player.play();
        }

        function toggleFullScreenPlayer() {
            const player = document.getElementById("mainVideoPlayer");
            if (player.requestFullscreen) {
                player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
                player.webkitRequestFullscreen();
            }
        }

        initData();
    </script>
</body>
    </html>

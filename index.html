<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bangla TRX Natok</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(22, 30, 49, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #0088cc;
            --primary-gradient: linear-gradient(135deg, #0088cc 0%, #00b4d8 100%);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --badge-bg: rgba(0, 136, 204, 0.15);
            --badge-text: #38bdf8;
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --surface-color: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.06);
            --text-color: #0f172a;
            --text-muted: #64748b;
            --input-bg: #e2e8f0;
            --badge-bg: #e0f2fe;
            --badge-text: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 14px;
            transition: background 0.3s ease;
        }

        /* হেডার */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 14px;
        }

        .header h1 {
            font-size: 19px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        /* সার্চ বক্স */
        .search-container {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(0, 136, 204, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
        }

        /* ক্যাটাগরি ট্যাব */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .category-chip {
            padding: 7px 15px;
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            color: var(--text-muted);
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .category-chip.active {
            background: var(--primary-gradient);
            color: #ffffff;
            font-weight: 600;
            border: none;
            box-shadow: 0 3px 10px rgba(0, 136, 204, 0.4);
        }

        /* ভিডিও কার্ড গ্রিড */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-card:active {
            transform: scale(0.97);
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%;
            background: #000;
        }

        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .video-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--text-color);
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .category-tag {
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* ডিটেইল ভিউ ও এড সেকশন */
        .detail-view {
            display: none;
            padding: 8px 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-card {
            background: var(--surface-color);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(12px);
        }

        .task-box {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-top: 14px;
            text-align: center;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-ad {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.35);
        }

        .btn-download {
            background: #10b981;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        .btn-disabled {
            background: var(--card-border);
            color: var(--text-muted);
            pointer-events: none;
            box-shadow: none;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- হেডার -->
    <div class="header">
        <h1><i class="fa-solid fa-circle-play"></i> Bangla TRX Natok</h1>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn"><i class="fa-solid fa-moon"></i> Dark</button>
    </div>

    <!-- মেইন ভিউ -->
    <div id="mainView">
        <!-- প্রফেশনাল সার্চ বার -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="নাটকের নাম বা পর্ব খুঁজুন..." oninput="handleSearch()">
        </div>

        <!-- ক্যাটাগরি বাটন -->
        <div class="category-scroll" id="categoryTabs">
            <div class="category-chip active" onclick="filterCategory('all', this)">সবগুলো</div>
            <div class="category-chip" onclick="filterCategory('BPS5', this)">BPS5</div>
            <div class="category-chip" onclick="filterCategory('Web Series', this)">Web Series</div>
            <div class="category-chip" onclick="filterCategory('Movie', this)">Movie</div>
        </div>

        <!-- ভিডিও গ্রিড -->
        <div class="video-grid" id="videoContainer"></div>
        <div class="empty-msg" id="emptyMessage" style="display: none;">কোনো ভিডিও খুঁজে পাওয়া যায়নি!</div>
    </div>

    <!-- ডিটেইল ভিউ (এড দেখার পেজ) -->
    <div class="detail-view" id="detailView">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i> ফিরে যান</button>
        <div class="detail-card">
            <img id="detailThumb" src="" style="width: 100%; border-radius: 12px; margin-bottom: 12px;">
            <h2 id="detailTitle" style="font-size: 16px; margin-bottom: 6px;"></h2>
            <span id="detailCategory" class="category-tag"></span>

            <div class="task-box">
                <p style="font-size: 12px; color: var(--text-muted);">ভিডিওটি ইনবক্সে পাওয়ার জন্য নিচের এডে ক্লিক করে ১০ সেকেন্ড অপেক্ষা করুন:</p>
                <button id="adBtn" class="action-btn btn-ad" onclick="startAd()">👉 অ্যাড দেখুন (১০ সেকেন্ড)</button>
                <button id="downloadBtn" class="action-btn btn-download btn-disabled" onclick="sendToInbox()">📥 ইনবক্সে ভিডিও নিন</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], ads: {} };
        let activeCategory = 'all';
        let currentSelectedVideo = null;
        let adClickedTime = 0;

        async function initData() {
            try {
                const res = await fetch("https://my-bot-server-bnj8.onrender.com/api/data?t=" + Date.now());
                appData = await res.json();
                renderVideos();
            } catch (err) {
                console.error("ডাটা লোড ত্রুটি:", err);
            }
        }

        function renderVideos() {
            const container = document.getElementById("videoContainer");
            const empty = document.getElementById("emptyMessage");
            const query = document.getElementById("searchInput").value.toLowerCase().trim();

            let list = appData.videos || [];

            // ক্যাটাগরি অনুযায়ী ফিল্টার
            if (activeCategory !== 'all') {
                list = list.filter(v => (v.category || '').toLowerCase() === activeCategory.toLowerCase());
            }

            // সার্চ কোয়েরি ফিল্টার
            if (query) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(query));
            }

            container.innerHTML = "";
            if (list.length === 0) {
                empty.style.display = "block";
            } else {
                empty.style.display = "none";
                list.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "video-card";
                    card.onclick = () => openDetail(item);
                    card.innerHTML = `
                        <div class="thumb-wrapper">
                            <img class="thumb-img" src="${item.thumb || 'https://via.placeholder.com/300x300?text=Natok'}" alt="Thumb">
                        </div>
                        <div class="card-details">
                            <div class="video-title">${item.title}</div>
                            <div class="video-meta">
                                <span class="category-tag">${item.category || 'নাটক'}</span>
                                <span><i class="fa-regular fa-clock"></i> ${item.date || ''}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function handleSearch() {
            renderVideos();
        }

        function filterCategory(cat, el) {
            activeCategory = cat;
            document.querySelectorAll(".category-chip").forEach(c => c.classList.remove("active"));
            el.classList.add("active");
            renderVideos();
        }

        function openDetail(video) {
            currentSelectedVideo = video;
            document.getElementById("mainView").style.display = "none";
            document.getElementById("detailView").style.display = "block";

            document.getElementById("detailThumb").src = video.thumb || 'https://via.placeholder.com/300x300';
            document.getElementById("detailTitle").innerText = video.title;
            document.getElementById("detailCategory").innerText = video.category || 'নাটক';

            // এড ও ডাউনলোড বাটন রিসেট
            const dlBtn = document.getElementById("downloadBtn");
            dlBtn.className = "action-btn btn-download btn-disabled";
            dlBtn.innerText = "📥 ইনবক্সে ভিডিও নিন";
            adClickedTime = 0;
        }

        function goBack() {
            document.getElementById("detailView").style.display = "none";
            document.getElementById("mainView").style.display = "block";
        }

        function startAd() {
            adClickedTime = Date.now();
            const adUrl = appData.ads?.ad1 || "https://google.com";
            if (tg && tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, "_blank");
            }

            const dlBtn = document.getElementById("downloadBtn");
            let remaining = 10;
            dlBtn.innerText = `⏳ অপেক্ষা করুন (${remaining}s)`;
            
            const timer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    dlBtn.innerText = `⏳ অপেক্ষা করুন (${remaining}s)`;
                } else {
                    clearInterval(timer);
                    dlBtn.innerText = "📥 ইনবক্সে ভিডিও নিন";
                    dlBtn.className = "action-btn btn-download";
                }
            }, 1000);
        }

        function sendToInbox() {
            if (Date.now() - adClickedTime < 10000) {
                alert("অনুগ্রহ করে অন্তত ১০ সেকেন্ড অ্যাডটি দেখে অপেক্ষা করুন!");
                return;
            }
            if (currentSelectedVideo && tg) {
                tg.openTelegramLink(`https://t.me/Bangla_TRX_Natok_bot?start=vid_${currentSelectedVideo.id}`);
                tg.close();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle("light-mode");
            const btn = document.getElementById("themeBtn");
            if (document.body.classList.contains("light-mode")) {
                btn.innerHTML = `<i class="fa-solid fa-sun"></i> Light`;
            } else {
                btn.innerHTML = `<i class="fa-solid fa-moon"></i> Dark`;
            }
        }

        initData();
    </script>
</body>
    </html>

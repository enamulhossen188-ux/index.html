<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bachelor Point</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c0e;
            --surface-color: #14161b;
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-red: #e50914;
            --neon-pink: #c026d3;
            --neon-blue: #00d2ff;
            --text-color: #ffffff;
            --text-muted: #8e9bb0;
            --input-bg: #1c1e24;
            --chip-bg: #1c1e24;
            --chip-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 12px;
        }

        /* সার্চ বক্স */
        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: #1a1c22;
            border: 1px solid var(--card-border);
            border-radius: 25px;
            color: var(--text-color);
            font-size: 13px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ক্যাটাগরি গ্রিড */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .category-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .category-btn.active {
            background: #e50914 !important;
            color: #ffffff !important;
        }

        /* 🔥 ফুল স্ক্রিনজুড়ে বড় ভিডিও কার্ড (১টি কলাম) 🔥 */
        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-card {
            background: var(--surface-color);
            border: 1.5px solid var(--neon-blue);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            width: 100%;
        }

        .pin-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e50914;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 14px;
            z-index: 5;
        }

        .thumb-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        /* থাম্বনেইল রেশিও */
        .thumb-wrapper.portrait {
            padding-top: 125%;
        }

        .thumb-wrapper.landscape {
            padding-top: 56.25%;
        }

        .thumb-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .card-details {
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
        }

        .video-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .meta-tag {
            color: #ef4444;
            font-weight: 700;
        }

        /* ডিটেইলস ও টাস্ক ভিউ */
        .detail-view {
            display: none;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .detail-thumb-container {
            width: 100%;
            margin: 0 auto 14px auto;
            border: 2px solid #ff007f;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .detail-thumb-container.portrait {
            aspect-ratio: 9 / 12;
        }

        .detail-thumb-container.landscape {
            aspect-ratio: 16 / 9;
        }

        .detail-thumb-img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .play-icon-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 55px; height: 55px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 24px;
        }

        .detail-title-box {
            border: 1.5px solid #ff007f;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
            background: rgba(255, 0, 127, 0.05);
        }

        .task-notice-box {
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 4px solid #ef4444;
            background: rgba(239, 68, 68, 0.08);
            padding: 10px 12px;
            font-size: 12px;
            margin-bottom: 14px;
            border-radius: 0 8px 8px 0;
        }

        .task-notice-box.success {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            color: #10b981;
        }

        .task-card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #1c1e24;
            border: 1.5px solid #ff007f;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .visit-action-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .visit-action-btn.done {
            background: #10b981 !important;
            pointer-events: none;
        }

        /* 🔥 আগের মতো ডাউনলোড ভিডিও বাটন 🔥 */
        .download-btn {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            margin-top: 10px;
            text-align: center;
        }

        .download-btn.disabled {
            background: #1e293b;
            color: #64748b;
            pointer-events: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- ১. হোম স্ক্রিন -->
    <div id="homeScreen">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ভিডিও নাম লিখে সার্চ দিন" oninput="handleSearch()">
        </div>

        <div class="category-grid" id="categoryTabs"></div>
        <div class="video-grid" id="videoContainer"></div>
    </div>

    <!-- ২. ডিটেইলস ও টাস্ক স্ক্রিন -->
    <div class="detail-view" id="detailScreen">
        <button class="back-btn" onclick="backToHome()"><i class="fa-solid fa-arrow-left"></i> Back</button>
        
        <div class="detail-thumb-container" id="detailThumbWrapper">
            <img id="detailThumb" class="detail-thumb-img" src="" alt="Thumbnail">
            <div class="play-icon-overlay"><i class="fa-solid fa-play"></i></div>
        </div>

        <div class="detail-title-box" id="detailTitle"></div>

        <div class="task-notice-box" id="taskNoticeBox">
            <i class="fa-solid fa-lock" id="taskNoticeIcon"></i>
            <span id="taskNoticeTxt">ভিডিওটি ডাউনলোড করার জন্য নিচের দুটি এড ১০ সেকেন্ড করে দেখুন।</span>
        </div>

        <div class="task-list" id="taskListContainer">
            <div class="task-card-row">
                <div>
                    <h4 style="font-size: 13px;">Task 1</h4>
                    <p style="font-size: 10px; color: var(--text-muted);" id="t1Txt">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                </div>
                <button id="task1Btn" class="visit-action-btn" onclick="executeTask(1)">VISIT</button>
            </div>

            <div class="task-card-row">
                <div>
                    <h4 style="font-size: 13px;">Task 2</h4>
                    <p style="font-size: 10px; color: var(--text-muted);" id="t2Txt">ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন</p>
                </div>
                <button id="task2Btn" class="visit-action-btn" onclick="executeTask(2)">VISIT</button>
            </div>
        </div>

        <!-- ডাউনলোড ভিডিও বাটন -->
        <button id="downloadBtn" class="download-btn" onclick="sendToInbox()">
            <i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও
        </button>
    </div>

    <script>
        const CURRENT_RENDER_URL = "https://index-html-6f0e.onrender.com";
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let appData = { videos: [], categories: [], ads: {} };
        let activeCategory = 'All';
        let currentVideo = null;
        let task1Done = false;
        let task2Done = false;
        let activeTaskNum = null;
        let taskStartStamp = 0;
        let popunderExecuted = false;

        // গ্লোবাল নিরাপদ পপআন্ডার
        function triggerSafePopunder() {
            if (popunderExecuted) return;
            const popUrl = (appData.ads?.popunder_ad || "").trim();
            if (popUrl.startsWith("http")) {
                popunderExecuted = true;
                if (tg && tg.openLink) tg.openLink(popUrl);
                else window.open(popUrl, "_blank");
            }
        }

        async function initData() {
            try {
                const res = await fetch(`${CURRENT_RENDER_URL}/api/data?t=${Date.now()}`);
                appData = await res.json();
                renderCategories();
                renderVideoCards();
            } catch (err) {
                console.error("ডাটা লোড ত্রুটি:", err);
            }
        }

        function renderCategories() {
            const container = document.getElementById("categoryTabs");
            const cats = ['All', ...(appData.categories || [])];
            let html = '';
            cats.forEach(c => {
                const isAct = (activeCategory.toLowerCase() === c.toLowerCase());
                html += `<button class="category-btn ${isAct ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>`;
            });
            container.innerHTML = html;
        }

        function selectCategory(cat) {
            triggerSafePopunder();
            activeCategory = cat;
            renderCategories();
            renderVideoCards();
        }

        function renderVideoCards() {
            const container = document.getElementById("videoContainer");
            const q = document.getElementById("searchInput").value.toLowerCase().trim();
            let list = appData.videos || [];

            if (activeCategory !== 'All') {
                list = list.filter(v => (v.category || '').toLowerCase() === activeCategory.toLowerCase());
            }
            if (q) {
                list = list.filter(v => (v.title || '').toLowerCase().includes(q));
            }

            container.innerHTML = "";
            list.forEach(v => {
                const card = document.createElement("div");
                card.className = "video-card";
                card.onclick = () => openDetailsView(v);

                const isPortrait = (v.ratio === "9:16");
                card.innerHTML = `
                    <div class="pin-badge">📌 PIN</div>
                    <div class="thumb-wrapper ${isPortrait ? 'portrait' : 'landscape'}">
                        <img class="thumb-img" src="${v.thumb}" onerror="this.src='https://placehold.co/600x400?text=Poster'">
                    </div>
                    <div class="card-details">
                        <div class="video-title">${v.title}</div>
                        <div class="video-meta-row">
                            <span><i class="fa-regular fa-clock"></i> ${v.date || 'Today'}</span>
                            <span class="meta-tag">${v.category || ''}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleSearch() {
            renderVideoCards();
        }

        function openDetailsView(video) {
            triggerSafePopunder();
            currentVideo = video;
            document.getElementById("homeScreen").style.display = "none";
            document.getElementById("detailScreen").style.display = "block";

            const thumbWrapper = document.getElementById("detailThumbWrapper");
            thumbWrapper.className = `detail-thumb-container ${(video.ratio === "9:16") ? 'portrait' : 'landscape'}`;
            document.getElementById("detailThumb").src = video.thumb;
            document.getElementById("detailTitle").innerText = video.title;

            resetTaskStatus();
        }

        function resetTaskStatus() {
            task1Done = false;
            task2Done = false;
            activeTaskNum = null;

            document.getElementById("task1Btn").className = "visit-action-btn";
            document.getElementById("task1Btn").innerText = "VISIT";
            document.getElementById("t1Txt").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            document.getElementById("task2Btn").className = "visit-action-btn";
            document.getElementById("task2Btn").innerText = "VISIT";
            document.getElementById("t2Txt").innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";

            document.getElementById("taskNoticeBox").className = "task-notice-box";
            document.getElementById("taskNoticeIcon").className = "fa-solid fa-lock";
            document.getElementById("taskNoticeTxt").innerText = "ভিডিওটি ডাউনলোড করার জন্য নিচের দুটি এড ১০ সেকেন্ড করে দেখুন।";

            document.getElementById("taskListContainer").style.display = "block";
            document.getElementById("downloadBtn").style.display = "none";
        }

        function backToHome() {
            document.getElementById("detailScreen").style.display = "none";
            document.getElementById("homeScreen").style.display = "block";
        }

        // 🔥 টাস্ক এক্সিকিউশন (জিরো-ডিলে) 🔥
        function executeTask(taskNum) {
            const directUrl = (taskNum === 1) ? (appData.ads?.ad1 || "").trim() : (appData.ads?.ad2 || "").trim();

            if (!directUrl.startsWith("http")) {
                alert("এডমিন এখনও কোনো বিজ্ঞাপন লিঙ্ক যুক্ত করেননি!");
                return;
            }

            activeTaskNum = taskNum;
            taskStartStamp = Date.now();

            if (tg && tg.openLink) tg.openLink(directUrl);
            else window.open(directUrl, "_blank");

            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");
            btn.innerText = "10s";
            txt.innerText = "অপেক্ষা করুন...";
        }

        // ব্যবহারকারী মিনি অ্যাপে ফিরে আসলে ভেরিফিকেশন
        function handleUserReturn() {
            if (document.visibilityState === "visible" && activeTaskNum !== null) {
                const elapsed = Math.floor((Date.now() - taskStartStamp) / 1000);
                const taskNum = activeTaskNum;
                activeTaskNum = null;

                if (elapsed >= 10) {
                    completeTaskSuccess(taskNum);
                } else {
                    const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
                    const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");
                    btn.innerText = "VISIT";
                    txt.innerText = "ভিজিট করে ১০ সেকেন্ড অপেক্ষা করুন";
                    alert(`দুঃখিত! আপনি ১০ সেকেন্ড অপেক্ষা করেন নাই। আরও ${10 - elapsed} সেকেন্ড দেখা প্রয়োজন ছিল।`);
                }
            }
        }

        document.addEventListener("visibilitychange", handleUserReturn);
        window.addEventListener("focus", handleUserReturn);

        function completeTaskSuccess(taskNum) {
            const btn = document.getElementById(taskNum === 1 ? "task1Btn" : "task2Btn");
            const txt = document.getElementById(taskNum === 1 ? "t1Txt" : "t2Txt");

            btn.className = "visit-action-btn done";
            btn.innerText = "COMPLETED";
            txt.innerText = "টাস্ক সম্পন্ন হয়েছে ✅";

            if (taskNum === 1) task1Done = true;
            if (taskNum === 2) task2Done = true;

            if (task1Done && task2Done) {
                document.getElementById("taskListContainer").style.display = "none";
                document.getElementById("taskNoticeBox").className = "task-notice-box success";
                document.getElementById("taskNoticeIcon").className = "fa-solid fa-circle-check";
                document.getElementById("taskNoticeTxt").innerText = "আপনি এড দেখা সম্পূর্ণ করেছেন। এখন সরাসরি ডাউনলোড করুন।";
                document.getElementById("downloadBtn").style.display = "block";
            }
        }

        // 🔥 টেলিগ্রাম ইনবক্সে ভিডিও পাঠানো 🔥
        async function sendToInbox() {
            if (!task1Done || !task2Done || !currentVideo) return;

            const dlBtn = document.getElementById("downloadBtn");
            dlBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ইনবক্সে পাঠানো হচ্ছে...`;
            dlBtn.classList.add("disabled");

            const userId = tg?.initDataUnsafe?.user?.id;
            if (!userId) {
                alert("ইউজার আইডি পাওয়া যায়নি! টেলিগ্রাম অ্যাপ থেকে মিনি অ্যাপটি ওপেন করুন।");
                dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও`;
                dlBtn.classList.remove("disabled");
                return;
            }

            try {
                const res = await fetch(`${CURRENT_RENDER_URL}/api/send_video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        video_id: currentVideo.id
                    })
                });

                const data = await res.json();
                if (data.success) {
                    dlBtn.innerHTML = `✅ সফল হয়েছে! ইনবক্স চেক করুন`;
                    setTimeout(() => {
                        if (tg && tg.close) tg.close();
                    }, 800);
                } else {
                    alert("ভিডিও পাঠানো যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।");
                    dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও`;
                    dlBtn.classList.remove("disabled");
                }
            } catch (err) {
                alert("সার্ভারে সংযোগ দেওয়া যাচ্ছে না। অনুগ্রহ করে ২ সেকেন্ড পর আবার চেষ্টা করুন।");
                dlBtn.innerHTML = `<i class="fa-solid fa-download"></i> ডাউনলোড ভিডিও`;
                dlBtn.classList.remove("disabled");
            }
        }

        initData();
    </script>
</body>
                </html>

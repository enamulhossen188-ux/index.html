<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangla TRX Natok</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 12px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }

        .tab-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #fff;
            border-color: #38bdf8;
            font-weight: 600;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .video-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .video-card:active {
            transform: scale(0.97);
        }

        .video-card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
        }

        .video-info {
            padding: 10px;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .video-meta {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }

        /* Detail Modal / View */
        #detail-view {
            display: none;
        }

        .back-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .detail-banner {
            width: 100%;
            border-radius: 12px;
            max-height: 240px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: 18px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 14px;
        }

        .notice-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .task-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .task-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .task-status {
            font-size: 12px;
            color: #f59e0b;
        }

        .task-status.done {
            color: #10b981;
            font-weight: 600;
        }

        .visit-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .visit-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .download-btn {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            margin-top: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #334155;
            color: #64748b;
        }

        .download-btn.unlocked {
            background: #10b981;
            color: white;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .loader {
            text-align: center;
            padding: 40px 0;
            color: #38bdf8;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Home View -->
    <div id="home-view">
        <div class="header">
            <h1><i class="fas fa-play-circle"></i> Bangla TRX Natok</h1>
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('All', this)">সবগুলো</button>
            <button class="tab-btn" onclick="filterCategory('BPS5', this)">BPS5</button>
            <button class="tab-btn" onclick="filterCategory('Web Series', this)">Web Series</button>
            <button class="tab-btn" onclick="filterCategory('Movie', this)">Movie</button>
        </div>

        <div id="loader" class="loader">
            <i class="fas fa-spinner fa-spin fa-2x"></i><br><br>ভিডিও লোড হচ্ছে...
        </div>

        <div class="video-grid" id="video-grid"></div>
    </div>

    <!-- Detail & Task View -->
    <div id="detail-view">
        <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> ফিরে যান</button>
        <img id="detail-img" class="detail-banner" src="" alt="Banner">
        <h2 id="detail-title" class="detail-title"></h2>

        <div class="notice-box">
            ⚠️ <b>সতর্কবার্তা:</b> এডে ক্লিক করে অবশ্যই সাইটে পুরো ১০ সেকেন্ড থাকতে হবে। আগে ফিরে আসলে আনলক হবে না।
        </div>

        <!-- Task 1 -->
        <div class="task-card">
            <div>
                <div class="task-title">Task 1: এডে ক্লিক করে ১০ সেকেন্ড ভিজিট করুন</div>
                <div id="status-task-1" class="task-status">অসম্পূর্ণ</div>
            </div>
            <button id="btn-task-1" class="visit-btn" onclick="startTask(1)">VISIT</button>
        </div>

        <!-- Task 2 -->
        <div class="task-card">
            <div>
                <div class="task-title">Task 2: এডে ক্লিক করে ১০ সেকেন্ড ভিজিট করুন</div>
                <div id="status-task-2" class="task-status">অসম্পূর্ণ</div>
            </div>
            <button id="btn-task-2" class="visit-btn" onclick="startTask(2)">VISIT</button>
        </div>

        <!-- Final Download Button -->
        <button id="final-download-btn" class="download-btn" disabled onclick="requestDownload()">
            <i class="fas fa-lock"></i> টাস্ক পূরণ করে আনলক করুন
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // আপনার Render API ইউআরএল
        const API_BASE = "https://bangla-trx-natok-bot.onrender.com"; 

        let appData = { videos: [], ads: {} };
        let currentVideo = null;
        let task1Done = false;
        let task2Done = false;

        async function initData() {
            try {
                const res = await fetch(`${API_BASE}/api/data`);
                appData = await res.json();
                document.getElementById('loader').style.display = 'none';
                renderVideos(appData.videos || []);
            } catch (err) {
                document.getElementById('loader').innerHTML = '❌ সার্ভার থেকে ডেটা লোড করা যায়নি!';
            }
        }

        function renderVideos(videos) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            if (!videos || videos.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #64748b; padding: 20px;">কোনো ভিডিও পাওয়া যায়নি</div>';
                return;
            }
            videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => openDetail(v);
                card.innerHTML = `
                    <img src="${v.thumb || 'https://placehold.co/400x250/1e293b/38bdf8?text=Natok'}" alt="${v.title}">
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                        <div class="video-meta">
                            <span><i class="fas fa-folder"></i> ${v.category || 'Natok'}</span>
                            <span>${v.date || ''}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'All') {
                renderVideos(appData.videos || []);
            } else {
                renderVideos((appData.videos || []).filter(v => v.category === cat));
            }
        }

        function openDetail(video) {
            currentVideo = video;
            task1Done = false;
            task2Done = false;

            document.getElementById('detail-img').src = video.thumb || 'https://placehold.co/600x300/1e293b/38bdf8?text=Natok';
            document.getElementById('detail-title').innerText = video.title;

            // টাস্ক রিসেট
            resetTaskUI(1);
            resetTaskUI(2);
            updateDownloadBtn();

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        function goBack() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }

        function resetTaskUI(num) {
            const st = document.getElementById(`status-task-${num}`);
            const btn = document.getElementById(`btn-task-${num}`);
            st.className = 'task-status';
            st.innerText = 'অসম্পূর্ণ';
            btn.disabled = false;
            btn.innerText = 'VISIT';
        }

        function startTask(num) {
            const adUrl = num === 1 ? (appData.ads?.ad1 || 'https://google.com') : (appData.ads?.ad2 || 'https://google.com');
            const btn = document.getElementById(`btn-task-${num}`);
            const st = document.getElementById(`status-task-${num}`);

            // এডে নিয়ে যাওয়া
            if (tg && tg.openLink) {
                tg.openLink(adUrl);
            } else {
                window.open(adUrl, '_blank');
            }

            // ১০ সেকেন্ড টাইমার
            let timeLeft = 10;
            btn.disabled = true;
            st.innerText = `অপেক্ষা করুন (${timeLeft}s)...`;

            const timer = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    st.innerText = `অপেক্ষা করুন (${timeLeft}s)...`;
                } else {
                    clearInterval(timer);
                    st.className = 'task-status done';
                    st.innerHTML = '<i class="fas fa-check-circle"></i> সম্পন্ন হয়েছে!';
                    btn.innerText = 'DONE';
                    if (num === 1) task1Done = true;
                    if (num === 2) task2Done = true;
                    updateDownloadBtn();
                }
            }, 1000);
        }

        function updateDownloadBtn() {
            const btn = document.getElementById('final-download-btn');
            if (task1Done && task2Done) {
                btn.disabled = false;
                btn.className = 'download-btn unlocked';
                btn.innerHTML = '<i class="fas fa-download"></i> ডাউনলোড করুন (ইনবক্সে ভিডিও যাবে)';
            } else {
                btn.disabled = true;
                btn.className = 'download-btn';
                btn.innerHTML = '<i class="fas fa-lock"></i> টাস্ক পূরণ করে আনলক করুন';
            }
        }

        function requestDownload() {
            if (!currentVideo) return;
            const btn = document.getElementById('final-download-btn');
            btn.disabled = true;
            btn.innerHTML = '✅ আপনার ইনবক্স চেক করুন!';

            // টেলিগ্রাম বটের ডিপলিংক দিয়ে সরাসরি ইনবক্সে পাঠানো
            const botUsername = "BanglaTRXNatok_bot";
            const deepLink = `https://t.me/${botUsername}?start=vid_${currentVideo.id}`;

            setTimeout(() => {
                if (tg && tg.openTelegramLink) {
                    tg.openTelegramLink(deepLink);
                    tg.close();
                } else {
                    window.location.href = deepLink;
                }
            }, 600);
        }

        initData();
    </script>
</body>
    </html>
